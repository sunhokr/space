# ERS-1 / ERS-2 raw-data parameters for scripts/read_ers_ceos.py (paper Sec. III-C, Fig. 7).
# Values marked "fill in" depend on the scene: take them from the CEOS leader file
# (data set summary / platform position records) or the product annotation.

sensor: ERS-1
polarisation: VV
carrier_frequency: 5.3e9        # [Hz]
wavelength: 0.0565646           # [m] = c / 5.3 GHz
fs: 18.962468e6                 # range sampling rate [Hz]
chirp_rate: 4.18989015e11       # [Hz/s]  (15.55 MHz / 37.12 us); flip the sign if the image is defocused
pulse_length: 37.12e-6          # [s]
chirp_start_freq: null          # null = centred chirp
n_samples: 5616                 # complex samples per echo line
prefix_bytes: 412               # line header bytes in every CEOS data record
dc_offset: auto                 # 'auto' = subtract the mean of I and Q (nominally 15.5)

prf: 1679.9                     # [Hz]  fill in (varies per orbit / scene)
near_range: 830000.0            # [m]   fill in: slant range of the first sample
effective_velocity: 7060.0      # [m/s] fill in: Vr = sqrt(Vs * Vg)
doppler_centroid: null          # null = estimated from the data (ACCC)

focusing:
  azimuth_sign: 0               # automatic selection of the azimuth phase convention
