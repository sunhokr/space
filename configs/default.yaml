# Default configuration of the CV autoencoder experiments.
# [paper] = value given in Asiyabi et al., IEEE JSTSP 2025
# [assumption] = not specified in the paper; chosen here (see README, "Assumptions")

model:
  N: 192                 # [paper] filters of conv layers 1-3 (Fig. 2)
  M: 320                 # [paper] latent channels (Fig. 2)
  kernel_size: 5         # [paper] 5x5 kernels, stride 2, padding 2, output padding 1
  gdn_mode: magnitude    # [assumption] CV-GDN normalises by sqrt(beta + gamma |x|^2) (phase preserving)
  init: random           # random (standard) | haar | polyphase  (optional exact-transform starts, NOT in
                         #   the paper; much faster convergence on almost-white raw data, need N >= 64,
                         #   M >= 256; haar = Walsh-Hadamard wavelet packet, recommended over polyphase)
  entropy_init_scale: null   # initial width of the factorized densities; null = auto:
                             #   10 for random init (Balle / CompressAI default), max(2, 2s) for polyphase

data:
  patch_size: 256        # [paper] 256 x 256 input patches
  normalization: patch_rms   # [assumption] per-patch RMS normalisation (scale sent as side info)
  global_scale: null     # only for normalization: global (null = estimate from training data)
  train_azimuth_range: [0.0, 0.9]   # [assumption] fraction of every training scene used for training
  val_azimuth_range: [0.9, 1.0]     # [assumption] held-out part used for validation
  samples_per_epoch: 8000
  val_samples: 128

train:
  # [assumption] lambda values; expected raw SQNR ~ 10*log10(2 ln2 * lambda) dB
  # 16 -> 13.5 dB, 32 -> 16.5, 64 -> 19.5, 128 -> 22.5, 256 -> 25.5, 512 -> 28.5
  lambdas: [16, 32, 64, 128, 256, 512]
  epochs: 100
  batch_size: 8
  lr: 1.0e-4             # [assumption] Adam (CompressAI default)
  aux_lr: 1.0e-3         # [assumption] Adam for the entropy-model quantiles
  clip_max_norm: 1.0
  num_workers: 2
  lr_patience: 5
  lr_factor: 0.5
  min_lr: 1.0e-6
  seed: 0
  device: auto
  max_iters: null        # stop after this many iterations per lambda (quick tests)
  init_from: null        # checkpoint to fine-tune from (e.g. Sentinel-1 model -> new sensor)
  entropy_lr_mult: 1.0   # learning-rate multiplier of the entropy-model densities (1 = standard)
  warmup_iters: 0        # linear learning-rate warm-up (useful with init: polyphase)

eval:
  baq_bits: [2, 3, 4, 5]          # [paper] BAQ operating points of Figs. 4-6
  baq_block: [1, 128]             # [assumption] 1 azimuth line x 128 range samples, 8-bit sigma
  jp2_bpp: [1.5, 2.0, 2.5, 3.0, 4.0, 5.0]
  coherence_window: 5             # [assumption] boxcar window of the local coherence estimate
  table_bpps: [2, 3, 4]           # [paper] Tables I-III
  target_sqnrs: [15, 20]          # [paper] bit-rate savings quoted in Sec. III-B

focusing:
  range_window_alpha: 0.75        # generalized Hamming (S-1 IPF uses 0.75)
  azimuth_window_alpha: 0.75
  azimuth_bandwidth_fraction: 0.8 # processed Doppler bandwidth / PRF
  azimuth_sign: -1                # -1 standard convention, 0 = automatic selection
